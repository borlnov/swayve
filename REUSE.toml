version = 1

[[annotations]]
# Platform scaffolding generated by `flutter create` and Flutter's own tracking file: many small
# files with no place for a header. Covered here in a blanket annotation. (These paths arrive with
# the Flutter project scaffold; declaring them ahead of time is harmless.)
path = ["macos/**", "windows/**", "android/**", "ios/**", "linux/**", "web/**", ".metadata"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# .gitmodules is a plain git config file: it has no comment syntax reuse recognizes, so its
# licensing information is declared here instead of inline.
path = [".gitmodules"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
